<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sign Up - FleetManage</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%230284C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V400v48c0 17.7-14.3 32-32 32H448c-17.7 0-32-14.3-32-32V400H96v48c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32V400 256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z'/></svg>"
        type="image/svg+xml">

    <!-- Tailwind + Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    fontWeight: {
                        regular: '400',
                        medium: '500',
                        semibold: '600',
                        bold: '700',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* === FLEETMANAGE THEME VARIABLES === */
        :root {
            --bg-color: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --bg-card: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --accent-color: #0284C7;
            --accent-dark: #0369A1; 
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            /* Fleet Logistics Background */
            background-image: linear-gradient(rgba(248, 250, 252, 0.95), rgba(248, 250, 252, 0.95)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
        }

        /* Logo Specific Utility Classes */
        .brand-logo {
            font-family: 'Playfair Display', serif;
            color: var(--text-main) !important;
        }

        /* LIGHT MODE */
        body:not(.dark-mode) .card-container {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(2, 132, 199, 0.15), 0 0 0 1px rgba(2, 132, 199, 0.05);
            border: 1px solid var(--border-color);
        }

        body:not(.dark-mode) input {
            background-color: var(--bg-secondary) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }

        body:not(.dark-mode) input::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.7;
        }

        body:not(.dark-mode) input:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        body:not(.dark-mode) label {
            color: var(--text-main) !important;
            font-weight: 600;
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-color: #0F172A;
            --bg-secondary: #1E293B;
            --bg-card: #1E293B;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --accent-color: #38BDF8;
            --accent-dark: #0EA5E9;
            --border-color: #334155;
            background-image: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80');
        }

        body.dark-mode .card-container {
            background-color: rgba(30, 41, 59, 0.95) !important;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        body.dark-mode input {
            background-color: var(--bg-secondary) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }

        body.dark-mode input::placeholder {
            color: var(--text-muted) !important;
        }

        body.dark-mode input:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        body.dark-mode label {
            color: var(--text-main) !important;
        }

        /* Social button base styling */
        .social-auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Light mode - social */
        body:not(.dark-mode) .social-auth-btn {
            background-color: var(--bg-color);
            border-color: var(--border-color);
        }

        body:not(.dark-mode) .social-auth-btn:hover {
            background-color: var(--bg-secondary);
            border-color: var(--accent-color);
        }

        body:not(.dark-mode) .google-icon { color: #4285F4; }
        body:not(.dark-mode) .microsoft-icon { color: #00A4EF; }
        body:not(.dark-mode) .apple-icon { color: #1e293b; }

        /* Dark mode - social */
        body.dark-mode .social-auth-btn {
            background-color: var(--bg-color);
            border-color: var(--border-color);
        }

        body.dark-mode .social-auth-btn:hover {
            background-color: var(--bg-secondary);
            border-color: var(--accent-color);
        }

        body.dark-mode .google-icon { color: #4285F4; }
        body.dark-mode .microsoft-icon { color: #00A4EF; }
        body.dark-mode .apple-icon { color: #ffffff; }

        /* Button text styling */
        .social-auth-btn .btn-text {
            font-size: 0.75rem;
            font-weight: 500;
        }

        body:not(.dark-mode) .social-auth-btn .btn-text { color: var(--text-main); }
        body.dark-mode .social-auth-btn .btn-text { color: var(--text-main); }

        /* Card styling - optimized to fit without scroll on desktop */
        .card-container {
            transition: background-color 0.4s ease, box-shadow 0.4s;
            max-width: 500px;
            width: 100%;
            border-radius: 1.5rem;
            margin: 0 auto;
            overflow: visible;
        }

        .rtl-flip {
            transform: scaleX(-1);
            display: inline-block;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .submit-arrow {
            transition: transform 0.2s ease;
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        /* FIXED TOGGLE BUTTONS OUTSIDE CARD */
        .fixed-toggles {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            background: var(--bg-color);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 60px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        body.dark-mode .fixed-toggles {
            border-color: var(--border-color);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .toggle-btn:hover {
            background: var(--accent-color);
            color: white !important;
            transform: scale(1.05);
        }

        body.rtl .fixed-toggles {
            right: auto;
            left: 20px;
        }

        /* SIGN UP BUTTON */
        #submitBtn {
            min-height: 52px;
            background: var(--accent-color);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
            border: none;
            cursor: pointer;
        }

        #submitBtn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-content {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
        }

        /* Optimized spacing - Same as template */
        input {
            width: 100%;
            font-size: 15px !important;
            padding: 12px 16px !important;
            border-radius: 12px !important;
        }

        label {
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        /* ===== DESKTOP OPTIMIZATION ===== */
        @media (min-width: 1024px) {
            body { padding: 20px; }
            .card-container { max-width: 480px; }
            .card-container>div { padding: 1.75rem !important; }
            .space-y-6>*+* { margin-top: 1rem; }
            .mb-8 { margin-bottom: 1.25rem; }
            .my-8 { margin-top: 1.25rem; margin-bottom: 1.25rem; }
            .mt-8 { margin-top: 1rem; }
            .mt-6 { margin-top: 1rem; }
            .py-4 { padding-top: 0.875rem; padding-bottom: 0.875rem; }
            h2.text-2xl { font-size: 1.5rem !important; }
            .text-sm { font-size: 0.8rem; }
        }

        /* ===== RESPONSIVE ADJUSTMENTS FOR MOBILE ===== */
        @media (max-width: 768px) {
            body { padding: 70px 16px 20px 16px; }
            .card-container { max-width: 100%; }
            .card-container>div { padding: 1.25rem !important; }
            .fixed-toggles { top: 12px; right: 12px; padding: 6px 10px; gap: 8px; }
            body.rtl .fixed-toggles { right: auto; left: 12px; }
            .toggle-btn { width: 36px; height: 36px; }
            #submitBtn { min-height: 48px; font-size: 0.9rem; }
            h2.text-2xl { font-size: 1.35rem !important; }
            input { padding: 10px 14px !important; }
            .social-auth-btn .btn-text { display: none; }
        }

        @media (max-width: 480px) {
            body { padding: 68px 12px 16px 12px; }
            .card-container>div { padding: 1rem !important; }
            .fixed-toggles { top: 10px; right: 10px; padding: 5px 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.85rem; }
            .btn-content { white-space: normal; text-align: center; }
            #submitBtn { min-height: 46px; font-size: 0.85rem; }
            .space-y-6>*+* { margin-top: 0.875rem; }
        }

        @media (max-width: 360px) {
            body { padding: 64px 10px 16px 10px; }
            .grid-cols-2 { gap: 8px; }
            #submitBtn { min-height: 44px; font-size: 0.8rem; }
        }

        /* Landscape mode */
        @media (max-height: 700px) and (orientation: landscape) {
            body { padding: 50px 20px 20px 20px; }
            .card-container { max-height: calc(100vh - 70px); overflow-y: auto; }
            .card-container::-webkit-scrollbar { width: 4px; }
            .card-container::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 4px; }
            .card-container::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 4px; }
        }

        /* Social buttons grid */
        .grid-cols-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .grid-cols-3 button {
            transition: all 0.2s ease;
        }

        .grid-cols-3 button:hover {
            transform: translateY(-2px);
        }

        .social-auth-btn i {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <!-- FIXED TOGGLE BUTTONS OUTSIDE CARD -->
    <div class="fixed-toggles">
        <button id="darkModeToggle" class="toggle-btn" aria-label="Dark/Light mode">
            <svg id="darkModeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
        <button id="rtlToggle" class="toggle-btn" aria-label="RTL/LTR mode">
            <span id="rtlIconText">LTR</span>
        </button>
    </div>

    <!-- MAIN CARD -->
    <div id="mainCard" class="card-container bg-[var(--bg-card)] rounded-2xl shadow-2xl overflow-hidden transition-all duration-300">
        <div class="p-6 sm:p-7">

            <!-- 100% IDENTICAL FLEETMANAGE BRAND HEADER -->
            <div class="flex items-center justify-center mb-6 pb-5 border-b border-[var(--border-color)]">
                <a href="index.html"
                    class="text-2xl brand-logo tracking-widest uppercase flex items-center whitespace-nowrap"
                    style="color: var(--text-main) !important; text-decoration: none;">
                    <i class="fas fa-truck"
                        style="color: var(--accent-color); margin-right: 0.45em; font-size: 0.9em; vertical-align: middle; filter: drop-shadow(0 0 4px rgba(2,132,199,0.35));"></i>FleetManage
                </a>
            </div>

            <!-- Welcome section -->
            <div class="mb-5 text-center">
                <h2 class="text-xl md:text-2xl font-bold tracking-tight brand-logo">Join the Fleet</h2>
                <p class="text-[var(--text-muted)] text-xs md:text-sm mt-2 font-medium">Create an account to manage your logistics</p>
            </div>

            <!-- Sign-up Form (Exact structure as template) -->
            <form id="signupForm" class="space-y-4">
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold mb-1.5">Full name</label>
                    <input type="text" name="fullname" id="fullname" required placeholder="Jane Doe"
                        class="w-full px-4 py-2.5 rounded-xl border transition-all duration-200 text-sm font-medium">
                </div>

                <!-- Email Address -->
                <div>
                    <label class="block text-xs font-bold mb-1.5">Email address</label>
                    <input type="email" name="email" id="email" required placeholder="admin@fleetmanage.com"
                        class="w-full px-4 py-2.5 rounded-xl border transition-all duration-200 text-sm font-medium">
                </div>

                <!-- Password -->
                <div class="password-wrapper relative">
                    <label class="block text-xs font-bold mb-1.5">Password</label>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 pe-10 rounded-xl border transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-eye absolute end-3 bottom-3 cursor-pointer" style="color: var(--accent-color);"
                        id="togglePassword"></i>
                </div>

                <!-- Confirm Password -->
                <div class="password-wrapper relative">
                    <label class="block text-xs font-bold mb-1.5">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" required placeholder="Confirm ••••••••"
                        class="w-full px-4 py-2.5 pe-10 rounded-xl border transition-all duration-200 text-sm font-medium">
                    <i class="fa-solid fa-eye absolute end-3 bottom-3 cursor-pointer" style="color: var(--accent-color);"
                        id="toggleConfirm"></i>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <div class="flex items-start gap-2 mt-1">
                    <input type="checkbox" id="termsCheckbox"
                        class="mt-0.5 w-3.5 h-3.5 rounded border-[var(--border-color)] text-[var(--accent-color)] focus:ring-[var(--accent-color)]/40 focus:ring-2 cursor-pointer">
                    <label for="termsCheckbox" class="text-xs font-medium cursor-pointer select-none leading-relaxed text-[var(--text-muted)]">
                        I agree to the
                        <a href="#" id="termsLink" class="font-semibold hover:underline" style="color: var(--accent-color);">Terms</a>
                        and
                        <a href="#" id="privacyLink" class="font-semibold hover:underline" style="color: var(--accent-color);">Privacy Policy</a>
                    </label>
                </div>

                <!-- Sign Up Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3 rounded-xl font-bold text-sm transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 group mt-3 cursor-pointer">
                    <span class="btn-content">Create Account <span
                            class="text-base submit-arrow transition-transform group-hover:translate-x-1">→</span></span>
                </button>
            </form>

            <!-- Divider -->
            <div class="my-5 flex items-center gap-3">
                <div class="flex-1 h-px bg-[var(--border-color)]"></div>
                <span class="text-[10px] font-bold uppercase tracking-wider text-[var(--text-muted)]">Or sign up with</span>
                <div class="flex-1 h-px bg-[var(--border-color)]"></div>
            </div>

            <!-- Social Sign Up Buttons -->
            <div class="grid grid-cols-3 gap-3">
                <!-- Google -->
                <button id="googleBtn" class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
                    <i class="fa-brands fa-google google-icon"></i>
                    <span class="btn-text">Google</span>
                </button>

                <!-- Microsoft (Corporate Theme matching Login) -->
                <button id="microsoftBtn" class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
                    <i class="fa-brands fa-windows microsoft-icon"></i>
                    <span class="btn-text">Microsoft</span>
                </button>

                <!-- Apple -->
                <button id="appleBtn" class="social-auth-btn border py-2.5 rounded-xl shadow-sm transition-all duration-200">
                    <i class="fa-brands fa-apple apple-icon"></i>
                    <span class="btn-text">Apple</span>
                </button>
            </div>

            <!-- Login Redirect Link -->
            <p class="text-center text-xs font-medium mt-5 text-[var(--text-muted)]">
                Already registered?
                <a href="login.html" id="loginLink" class="font-extrabold hover:underline ms-1"
                    style="color: var(--accent-color);">Login →</a>
            </p>
        </div>
    </div>

    <script>
        (function () {
            // Dark Mode Logic
            const darkModeToggle = document.getElementById('darkModeToggle');
            const body = document.body;
            const htmlElement = document.documentElement;

            const savedDark = localStorage.getItem('theme');
            if (savedDark === 'dark') {
                body.classList.add('dark-mode');
                updateDarkIcon(true);
            } else {
                body.classList.remove('dark-mode');
                updateDarkIcon(false);
            }

            function updateDarkIcon(isDark) {
                const iconSvg = document.getElementById('darkModeIcon');
                if (isDark) {
                    iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
                } else {
                    iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
                }
            }

            darkModeToggle.addEventListener('click', () => {
                const isDarkNow = body.classList.toggle('dark-mode');
                localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
                updateDarkIcon(isDarkNow);
            });

            // RTL / LTR Toggle
            const rtlToggleBtn = document.getElementById('rtlToggle');
            const rtlIconSpan = document.getElementById('rtlIconText');

            function applyDirection(dir) {
                if (dir === 'rtl') {
                    htmlElement.setAttribute('dir', 'rtl');
                    body.classList.add('rtl');
                    rtlIconSpan.innerText = 'RTL';
                    localStorage.setItem('dir', 'rtl');
                    const arrowSpan = document.querySelector('.submit-arrow');
                    if (arrowSpan) arrowSpan.classList.add('rtl-flip');
                } else {
                    htmlElement.setAttribute('dir', 'ltr');
                    body.classList.remove('rtl');
                    rtlIconSpan.innerText = 'LTR';
                    localStorage.setItem('dir', 'ltr');
                    const arrowSpan = document.querySelector('.submit-arrow');
                    if (arrowSpan) arrowSpan.classList.remove('rtl-flip');
                }
            }

            const savedDir = localStorage.getItem('dir');
            if (savedDir === 'rtl') applyDirection('rtl');
            else applyDirection('ltr');

            rtlToggleBtn.addEventListener('click', () => {
                const currentDir = htmlElement.getAttribute('dir');
                const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
                applyDirection(newDir);
            });

            // Form Validation
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const fullnameInput = document.getElementById('fullname');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm_password');
            const termsCheckbox = document.getElementById('termsCheckbox');

            const originalBtnHTML = submitBtn.innerHTML;

            function showBtnMessage(message, isError = true) {
                if (isError) {
                    submitBtn.innerHTML = `<span class="btn-content">⚠️ ${message}</span>`;
                    submitBtn.style.background = '#dc2626';
                } else {
                    submitBtn.innerHTML = `<span class="btn-content">✓ ${message}</span>`;
                    submitBtn.style.background = '#16a34a';
                }
                setTimeout(() => {
                    submitBtn.innerHTML = originalBtnHTML;
                    submitBtn.style.background = 'var(--accent-color)';
                }, 2400);
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const fullname = fullnameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirm = confirmInput.value;
                const termsAccepted = termsCheckbox.checked;

                if (!fullname) {
                    showBtnMessage('Full name is required', true);
                    fullnameInput.focus();
                    return;
                }
                if (!email) {
                    showBtnMessage('Email address required', true);
                    emailInput.focus();
                    return;
                }
                if (!email.includes('@') || !email.includes('.')) {
                    showBtnMessage('Enter a valid email', true);
                    emailInput.focus();
                    return;
                }
                if (!password) {
                    showBtnMessage('Please create a password', true);
                    passwordInput.focus();
                    return;
                }
                if (password.length < 6) {
                    showBtnMessage('Password must be at least 6 characters', true);
                    passwordInput.focus();
                    return;
                }
                if (password !== confirm) {
                    showBtnMessage('Passwords do not match', true);
                    confirmInput.focus();
                    return;
                }
                if (!termsAccepted) {
                    showBtnMessage('You must accept Terms & Privacy Policy', true);
                    termsCheckbox.focus();
                    return;
                }

                showBtnMessage('Account created! Redirecting...', false);
                setTimeout(() => {
                    form.reset();
                    window.location.href = "login.html";
                }, 1500);
            });

            // Social auth demo
            document.getElementById('googleBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('🔐 Google Sign-Up: Connect your Enterprise Google Workspace account.');
            });

            document.getElementById('microsoftBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('🏢 Microsoft Sign-Up: Connect your Office 365/Azure AD account.');
            });

            document.getElementById('appleBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('🍎 Apple Sign-Up: Secure sign-in with Apple ID.');
            });

            // Links demo
            document.getElementById('termsLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('FleetManage Terms of Service: Master Service Agreement and Usage limits.');
            });

            document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                alert('FleetManage Privacy Policy: Data collection, telemetry handling, and security measures.');
            });
        })();

        // Password toggle functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });
        }

        // Confirm password toggle
        const toggleConfirm = document.getElementById('toggleConfirm');
        const confirmInput = document.getElementById('confirm_password');

        if (toggleConfirm && confirmInput) {
            toggleConfirm.addEventListener('click', () => {
                const type = confirmInput.type === 'password' ? 'text' : 'password';
                confirmInput.type = type;
                toggleConfirm.classList.toggle('fa-eye');
                toggleConfirm.classList.toggle('fa-eye-slash');
            });
        }
    </script>
</body>
</html>
